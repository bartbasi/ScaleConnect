[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaleconnect"
version = "0.1.0"
description = "Add, edit and delete products on Tor-rey label printing scales."
requires-python = ">=3.13"
license = {text = "GPL-3.0-only, with additional terms under section 7. See NOTICE."}
authors = [{name = "Bart Basi"}]
dependencies = [
    "fastapi",
    "uvicorn",
    "mcp",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
scaleconnect = "scaleconnect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scaleconnect.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
